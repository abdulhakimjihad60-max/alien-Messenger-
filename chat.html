<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alien Messenger</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#111827;
  color:white;
  height:100vh;
  overflow:hidden;
}

.app{
  display:flex;
  height:100vh;
}

/* SIDEBAR */
.sidebar{
  width:330px;
  background:#172033;
  border-right:1px solid #293449;
  display:flex;
  flex-direction:column;
}

.header{
  padding:18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid #293449;
}

.logo{
  font-size:21px;
  font-weight:bold;
}

.profile-small{
  display:flex;
  align-items:center;
  gap:10px;
}

.profile-small img{
  width:42px;
  height:42px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid #5865f2;
}

.profile-small span{
  font-size:13px;
  color:#cbd5e1;
}

.users-title{
  padding:15px 18px 8px;
  color:#94a3b8;
  font-size:13px;
  text-transform:uppercase;
}

.users{
  overflow-y:auto;
  flex:1;
}

.user{
  padding:12px 15px;
  display:flex;
  align-items:center;
  gap:12px;
  cursor:pointer;
  transition:.2s;
}

.user:hover{
  background:#202b40;
}

.user.active{
  background:#293756;
}

.avatar{
  position:relative;
}

.avatar img{
  width:48px;
  height:48px;
  border-radius:50%;
  object-fit:cover;
  background:#374151;
}

.online-dot{
  position:absolute;
  width:12px;
  height:12px;
  background:#22c55e;
  border:2px solid #172033;
  border-radius:50%;
  bottom:1px;
  right:1px;
}

.user-info{
  min-width:0;
}

.user-name{
  font-weight:bold;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.user-email{
  color:#94a3b8;
  font-size:12px;
  margin-top:3px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* CHAT */
.chat{
  flex:1;
  display:flex;
  flex-direction:column;
  min-width:0;
}

.chat-header{
  height:75px;
  padding:12px 20px;
  background:#172033;
  border-bottom:1px solid #293449;
  display:flex;
  align-items:center;
  gap:12px;
}

.chat-header img{
  width:48px;
  height:48px;
  border-radius:50%;
  object-fit:cover;
}

.chat-person{
  flex:1;
}

.chat-name{
  font-size:17px;
  font-weight:bold;
}

.chat-status{
  color:#22c55e;
  font-size:12px;
  margin-top:3px;
}

.logout{
  border:none;
  background:#ef4444;
  color:white;
  padding:9px 13px;
  border-radius:8px;
  cursor:pointer;
}

.messages{
  flex:1;
  overflow-y:auto;
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:7px;
  background:#0f172a;
}

.empty{
  margin:auto;
  color:#64748b;
  text-align:center;
}

.message{
  max-width:70%;
  padding:10px 14px;
  border-radius:18px;
  background:#273449;
  align-self:flex-start;
  word-wrap:break-word;
  line-height:1.4;
}

.message.mine{
  background:#5865f2;
  align-self:flex-end;
  border-bottom-right-radius:5px;
}

.message.theirs{
  border-bottom-left-radius:5px;
}

.message-time{
  display:block;
  font-size:10px;
  opacity:.65;
  margin-top:4px;
  text-align:right;
}

.seen{
  font-size:10px;
  opacity:.7;
  margin-left:4px;
}

/* INPUT */
.input-area{
  padding:12px;
  background:#172033;
  border-top:1px solid #293449;
  display:flex;
  gap:10px;
}

.input-area input{
  flex:1;
  background:#263246;
  border:none;
  outline:none;
  color:white;
  padding:13px 16px;
  border-radius:22px;
  font-size:15px;
}

.send{
  width:48px;
  height:48px;
  border:none;
  border-radius:50%;
  background:#5865f2;
  color:white;
  font-size:19px;
  cursor:pointer;
}

.send:hover{
  background:#4752c4;
}

/* PROFILE */
.profile-box{
  padding:12px;
  border-top:1px solid #293449;
}

.profile-btn{
  display:block;
  width:100%;
  background:#263246;
  color:white;
  padding:10px;
  border-radius:8px;
  cursor:pointer;
  text-align:center;
}

.file-input{
  display:none;
}

/* MOBILE */
@media(max-width:700px){

  .sidebar{
    width:75px;
  }

  .logo{
    font-size:20px;
    text-align:center;
  }

  .profile-small span,
  .users-title,
  .user-info,
  .profile-btn{
    display:none;
  }

  .header{
    justify-content:center;
    padding:12px 5px;
  }

  .profile-small img{
    width:42px;
    height:42px;
  }

  .user{
    justify-content:center;
    padding:12px 5px;
  }

  .avatar img{
    width:50px;
    height:50px;
  }

  .chat-header{
    padding:10px;
  }

  .chat-header img{
    width:42px;
    height:42px;
  }

  .logout{
    font-size:11px;
    padding:7px;
  }

  .message{
    max-width:82%;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar">

    <div class="header">

      <div class="logo">👽 Alien</div>

      <div class="profile-small">
        <img id="myPhoto" src="https://i.imgur.com/6VBx3io.png">
        <span id="myName">User</span>
      </div>

    </div>

    <div class="users-title">Chats</div>

    <div id="users" class="users">
      <div class="empty">Loading users...</div>
    </div>

    <div class="profile-box">

      <label for="photoInput" class="profile-btn">
        📷 Change Profile Photo
      </label>

      <input
        id="photoInput"
        class="file-input"
        type="file"
        accept="image/*">

    </div>

  </aside>


  <!-- CHAT -->
  <main class="chat">

    <div class="chat-header">

      <img id="chatPhoto"
           src="https://i.imgur.com/6VBx3io.png">

      <div class="chat-person">

        <div id="chatName" class="chat-name">
          Select a person
        </div>

        <div id="chatStatus" class="chat-status">
          Choose someone to chat
        </div>

      </div>

      <button id="logoutBtn" class="logout">
        Logout
      </button>

    </div>


    <div id="messages" class="messages">

      <div class="empty">
        👽 Select a user to start chatting
      </div>

    </div>


    <div class="input-area">

      <input
        id="messageInput"
        type="text"
        placeholder="Type a message..."
        autocomplete="off">

      <button id="sendBtn" class="send">
        ➤
      </button>

    </div>

  </main>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signOut
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getFirestore,
  collection,
  doc,
  setDoc,
  getDoc,
  getDocs,
  query,
  where,
  orderBy,
  onSnapshot,
  addDoc,
  updateDoc,
  serverTimestamp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* FIREBASE CONFIG */

const firebaseConfig = {
  apiKey: "AIzaSyB6DFVQNrPmKtshg978khg7GAKCrS69ANU",
  authDomain: "alien-pori---chat.firebaseapp.com",
  projectId: "alien-pori---chat",
  storageBucket: "alien-pori---chat.firebasestorage.app",
  messagingSenderId: "141609051933",
  appId: "1:141609051933:web:7abdb1828986b5a29ee3f4",
  measurementId: "G-KC5NKQ57H6"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* ELEMENTS */

const usersBox =
document.getElementById("users");

const messagesBox =
document.getElementById("messages");

const messageInput =
document.getElementById("messageInput");

const sendBtn =
document.getElementById("sendBtn");

const logoutBtn =
document.getElementById("logoutBtn");

const myPhoto =
document.getElementById("myPhoto");

const myName =
document.getElementById("myName");

const chatPhoto =
document.getElementById("chatPhoto");

const chatName =
document.getElementById("chatName");

const chatStatus =
document.getElementById("chatStatus");

const photoInput =
document.getElementById("photoInput");


let currentUser = null;

let selectedUser = null;

let unsubscribeMessages = null;


const defaultPhoto =
"https://i.imgur.com/6VBx3io.png";


/* AUTH */

onAuthStateChanged(auth, async (user) => {

  if(!user){

    window.location.href = "login.html";

    return;
  }

  currentUser = user;

  myName.textContent =
  user.email || "User";

  try{

    await createOrUpdateMyProfile();

    await loadMyProfile();

    await loadUsers();

  }catch(error){

    console.error(error);

    usersBox.innerHTML =
    `<div class="empty">
      Firebase error
      <br>
      ${escapeHtml(error.message)}
    </div>`;

  }

});


/* CREATE PROFILE */

async function createOrUpdateMyProfile(){

  const ref =
  doc(db,"users",currentUser.uid);

  const existing =
  await getDoc(ref);

  if(!existing.exists()){

    await setDoc(ref,{

      uid:currentUser.uid,

      email:currentUser.email || "",

      name:
      currentUser.email
      ? currentUser.email.split("@")[0]
      : "User",

      photo:defaultPhoto,

      online:true,

      lastSeen:serverTimestamp(),

      createdAt:serverTimestamp()

    });

  }else{

    await updateDoc(ref,{

      online:true,

      lastSeen:serverTimestamp(),

      email:currentUser.email || ""

    });

  }

}


/* LOAD MY PROFILE */

async function loadMyProfile(){

  const ref =
  doc(db,"users",currentUser.uid);

  const snap =
  await getDoc(ref);

  if(snap.exists()){

    const data =
    snap.data();

    myName.textContent =
    data.name || currentUser.email;

    myPhoto.src =
    data.photo || defaultPhoto;

  }

}


/* LOAD USERS */

async function loadUsers(){

  usersBox.innerHTML =
  `<div class="empty">Loading users...</div>`;

  const snap =
  await getDocs(
    collection(db,"users")
  );

  usersBox.innerHTML = "";

  let count = 0;

  snap.forEach((docSnap)=>{

    const data =
    docSnap.data();

    if(data.uid === currentUser.uid)
      return;

    count++;

    createUserItem(data);

  });

  if(count === 0){

    usersBox.innerHTML =
    `<div class="empty">
      No other users yet
    </div>`;

  }

}


/* USER ITEM */

function createUserItem(data){

  const item =
  document.createElement("div");

  item.className = "user";

  const photo =
  data.photo || defaultPhoto;

  item.innerHTML = `

    <div class="avatar">

      <img src="${photo}">

      ${
        data.online
        ? `<div class="online-dot"></div>`
        : ""
      }

    </div>

    <div class="user-info">

      <div class="user-name">
        ${escapeHtml(data.name || "User")}
      </div>

      <div class="user-email">
        ${escapeHtml(data.email || "")}
      </div>

    </div>

  `;

  item.onclick = ()=>{

    document
    .querySelectorAll(".user")
    .forEach(x =>
      x.classList.remove("active")
    );

    item.classList.add("active");

    selectUser(data);

  };

  usersBox.appendChild(item);

}


/* SELECT USER */

function selectUser(user){

  selectedUser = user;

  chatName.textContent =
  user.name || "User";

  chatPhoto.src =
  user.photo || defaultPhoto;

  chatStatus.textContent =
  user.online
  ? "● Online"
  : "Offline";

  messagesBox.innerHTML =
  `<div class="empty">
    Loading messages...
  </div>`;

  messageInput.focus();

  listenMessages();

}


/* CHAT ID */

function getChatId(uid1,uid2){

  return [uid1,uid2]
  .sort()
  .join("_");

}


/* REAL-TIME MESSAGES */

function listenMessages(){

  if(unsubscribeMessages)
    unsubscribeMessages();

  if(!selectedUser)
    return;

  const chatId =
  getChatId(
    currentUser.uid,
    selectedUser.uid
  );

  const q =
  query(

    collection(db,"messages"),

    where("chatId","==",chatId),

    orderBy("createdAt","asc")

  );

  unsubscribeMessages =
  onSnapshot(q,(snapshot)=>{

    messagesBox.innerHTML = "";

    if(snapshot.empty){

      messagesBox.innerHTML =
      `<div class="empty">
        👽 Say hello!
      </div>`;

      return;

    }

    snapshot.forEach((docSnap)=>{

      const data =
      docSnap.data();

      const message =
      document.createElement("div");

      const mine =
      data.senderUid === currentUser.uid;

      message.className =
      "message " +
      (mine ? "mine" : "theirs");

      let time = "";

      if(data.createdAt){

        try{

          time =
          data.createdAt
          .toDate()
          .toLocaleTimeString(
            [],
            {
              hour:"2-digit",
              minute:"2-digit"
            }
          );

        }catch(e){}

      }

      message.innerHTML = `

        ${escapeHtml(data.text || "")}

        <span class="message-time">

          ${time}

          ${
            mine && data.seen
            ? `<span class="seen">
                Seen ✓
              </span>`
            : ""
          }

        </span>

      `;

      messagesBox.appendChild(message);

      /* MARK AS SEEN */

      if(
        !mine &&
        !data.seen
      ){

        updateDoc(
          doc(
            db,
            "messages",
            docSnap.id
          ),
          {
            seen:true
          }
        ).catch(()=>{});

      }

    });

    messagesBox.scrollTop =
    messagesBox.scrollHeight;

  },(error)=>{

    console.error(error);

    messagesBox.innerHTML =
    `<div class="empty">
      Unable to load messages.
      <br><br>
      ${escapeHtml(error.message)}
    </div>`;

  });

}


/* SEND MESSAGE */

async function sendMessage(){

  const text =
  messageInput.value.trim();

  if(!text)
    return;

  if(!selectedUser){

    alert("First select a person.");

    return;
  }

  const chatId =
  getChatId(
    currentUser.uid,
    selectedUser.uid
  );

  try{

    await addDoc(
      collection(db,"messages"),
      {

        chatId:chatId,

        text:text,

        senderUid:
        currentUser.uid,

        senderEmail:
        currentUser.email || "",

        receiverUid:
        selectedUser.uid,

        receiverEmail:
        selectedUser.email || "",

        seen:false,

        createdAt:
        serverTimestamp()

      }
    );

    messageInput.value = "";

    messageInput.focus();

  }catch(error){

    console.error(error);

    alert(
      "Message send failed: "
      + error.message
    );

  }

}


/* SEND */

sendBtn.addEventListener(
  "click",
  sendMessage
);


/* ENTER */

messageInput.addEventListener(
  "keydown",
  (e)=>{

    if(e.key === "Enter"){

      e.preventDefault();

      sendMessage();

    }

  }
);


/* PROFILE PHOTO */

photoInput.addEventListener(
  "change",
  async (event)=>{

    const file =
    event.target.files[0];

    if(!file)
      return;

    if(!file.type.startsWith("image/")){

      alert("Please select an image.");

      return;

    }

    try{

      const photo =
      await resizeImage(file);

      await updateDoc(
        doc(
          db,
          "users",
          currentUser.uid
        ),
        {
          photo:photo
        }
      );

      myPhoto.src = photo;

      await loadUsers();

      alert(
        "Profile photo updated! 👽"
      );

    }catch(error){

      console.error(error);

      alert(
        "Photo update failed: "
        + error.message
      );

    }

  }
);


/* RESIZE IMAGE */

function resizeImage(file){

  return new Promise(
    (resolve,reject)=>{

      const reader =
      new FileReader();

      reader.onload =
      (event)=>{

        const img =
        new Image();

        img.onload = ()=>{

          const canvas =
          document.createElement("canvas");

          const max = 300;

          let width =
          img.width;

          let height =
          img.height;

          if(width > height){

            if(width > max){

              height =
              height * max / width;

              width = max;

            }

          }else{

            if(height > max){

              width =
              width * max / height;

              height = max;

            }

          }

          canvas.width =
          width;

          canvas.height =
          height;

          const ctx =
          canvas.getContext("2d");

          ctx.drawImage(
            img,
            0,
            0,
            width,
            height
          );

          resolve(
            canvas.toDataURL(
              "image/jpeg",
              0.75
            )
          );

        };

        img.onerror = reject;

        img.src =
        event.target.result;

      };

      reader.onerror = reject;

      reader.readAsDataURL(file);

    }
  );

}


/* LOGOUT */

logoutBtn.addEventListener(
  "click",
  async ()=>{

    try{

      if(currentUser){

        await updateDoc(
          doc(
            db,
            "users",
            currentUser.uid
          ),
          {
            online:false,
            lastSeen:serverTimestamp()
          }
        );

      }

      await signOut(auth);

      window.location.href =
      "login.html";

    }catch(error){

      console.error(error);

      window.location.href =
      "login.html";

    }

  }
);


/* ESCAPE HTML */

function escapeHtml(text){

  const div =
  document.createElement("div");

  div.textContent =
  text;

  return div.innerHTML;

}

</script>

</body>
</html>
