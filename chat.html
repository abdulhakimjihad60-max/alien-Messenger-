<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Alien Messenger</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: #1f2937;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #374151;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
    }

    .logout {
      background: #ef4444;
      color: white;
      border: none;
      padding: 9px 14px;
      border-radius: 8px;
      cursor: pointer;
    }

    .chat {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
    }

    .message {
      max-width: 75%;
      padding: 10px 13px;
      margin: 8px 0;
      border-radius: 12px;
      background: #374151;
    }

    .my-message {
      margin-left: auto;
      background: #2563eb;
    }

    .sender {
      font-size: 11px;
      opacity: 0.75;
      margin-bottom: 4px;
    }

    .message-text {
      font-size: 15px;
      word-wrap: break-word;
    }

    .message-box {
      display: flex;
      padding: 10px;
      background: #1f2937;
      border-top: 1px solid #374151;
    }

    .message-box input {
      flex: 1;
      padding: 13px;
      border: none;
      outline: none;
      border-radius: 8px;
      background: #374151;
      color: white;
      font-size: 15px;
    }

    .send {
      margin-left: 8px;
      padding: 0 18px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .empty {
      text-align: center;
      color: #9ca3af;
      margin-top: 40px;
    }
  </style>
</head>

<body>

  <div class="header">
    <div class="logo">👽 Alien Messenger</div>
    <button class="logout" id="logoutBtn">Logout</button>
  </div>

  <div class="chat" id="chat">
    <div class="empty">Loading messages...</div>
  </div>

  <div class="message-box">
    <input
      type="text"
      id="messageInput"
      placeholder="Type a message..."
      autocomplete="off"
    >

    <button class="send" id="sendBtn">
      Send
    </button>
  </div>


  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged,
      signOut
    }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    import {
      getFirestore,
      collection,
      addDoc,
      query,
      orderBy,
      onSnapshot,
      serverTimestamp
    }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


    /* Firebase Configuration */

    const firebaseConfig = {
      apiKey: "AIzaSyB6DFVQNrPmKtshg978khg7GAKCrS69ANU",
      authDomain: "alien-pori---chat.firebaseapp.com",
      projectId: "alien-pori---chat",
      storageBucket: "alien-pori---chat.firebasestorage.app",
      messagingSenderId: "141609051933",
      appId: "1:141609051933:web:7abdb1828986b5a29ee3f4",
      measurementId: "G-KC5NKQ57H6"
    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);


    const chat = document.getElementById("chat");

    const input = document.getElementById("messageInput");

    const sendBtn = document.getElementById("sendBtn");

    const logoutBtn = document.getElementById("logoutBtn");


    let currentUser = null;


    /* Check Login */

    onAuthStateChanged(auth, (user) => {

      if (!user) {

        window.location.href = "login.html";

        return;

      }

      currentUser = user;

      loadMessages();

    });


    /* Load Messages in Real Time */

    function loadMessages() {

      const messagesRef =
        collection(db, "messages");


      const q = query(
        messagesRef,
        orderBy("createdAt", "asc")
      );


      onSnapshot(
        q,
        (snapshot) => {

          chat.innerHTML = "";


          if (snapshot.empty) {

            chat.innerHTML =
              '<div class="empty">No messages yet 👽</div>';

            return;

          }


          snapshot.forEach((doc) => {

            const data = doc.data();


            const messageDiv =
              document.createElement("div");

            messageDiv.classList.add("message");


            if (
              currentUser &&
              data.senderUid === currentUser.uid
            ) {

              messageDiv.classList.add("my-message");

            }


            const sender =
              document.createElement("div");

            sender.classList.add("sender");

            sender.textContent =
              data.senderRole ||
              data.senderEmail ||
              "User";


            const text =
              document.createElement("div");

            text.classList.add("message-text");

            text.textContent =
              data.text || "";


            messageDiv.appendChild(sender);

            messageDiv.appendChild(text);

            chat.appendChild(messageDiv);

          });


          chat.scrollTop =
            chat.scrollHeight;

        },

        (error) => {

          chat.innerHTML =
            '<div class="empty">Unable to load messages.</div>';

          console.error(error);

        }
      );

    }


    /* Send Message */

    async function sendMessage() {

      const text =
        input.value.trim();


      if (!text || !currentUser) {

        return;

      }


      sendBtn.disabled = true;


      try {

        await addDoc(
          collection(db, "messages"),
          {

            text: text,

            senderUid:
              currentUser.uid,

            senderEmail:
              currentUser.email || "",

            senderRole:
              currentUser.email || "User",

            seen: false,

            createdAt:
              serverTimestamp()

          }
        );


        input.value = "";

        input.focus();


      } catch (error) {

        alert(
          "Message send failed: " +
          error.message
        );

      }


      sendBtn.disabled = false;

    }


    /* Send Button */

    sendBtn.addEventListener(
      "click",
      sendMessage
    );


    /* Send with Enter */

    input.addEventListener(
      "keydown",
      (event) => {

        if (event.key === "Enter") {

          sendMessage();

        }

      }
    );


    /* Logout */

    logoutBtn.addEventListener(
      "click",
      async () => {

        try {

          await signOut(auth);

          window.location.href =
            "login.html";

        } catch (error) {

          alert(error.message);

        }

      }
    );

  </script>

</body>
</html>
