<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Alien Messenger - Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #050505, #14213d, #001f1f);
      color: white;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 400px;
      padding: 30px 25px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
    }

    .logo {
      text-align: center;
      font-size: 50px;
      margin-bottom: 10px;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      border: none;
      border-radius: 10px;
      outline: none;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }

    .login {
      background: #00e5ff;
      color: #001014;
    }

    .signup {
      background: #ffffff;
      color: #111111;
    }

    .message {
      min-height: 22px;
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #00e5ff;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="logo">👽</div>

    <h1>Alien Messenger</h1>

    <input
      type="email"
      id="email"
      placeholder="Email"
      autocomplete="email"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button class="login" id="loginBtn">
      Login
    </button>

    <button class="signup" id="signupBtn">
      Create Account
    </button>

    <div class="message" id="message"></div>

    <a class="back" href="index.html">
      ← Back to Home
    </a>

  </div>

  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword
    }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


    const firebaseConfig = {
      apiKey: "AIzaSyB6DFVQNrPmKtshg978khg7GAKCrS69ANU",
      authDomain: "alien-pori---chat.firebaseapp.com",
      projectId: "alien-pori---chat",
      storageBucket: "alien-pori---chat.firebasestorage.app",
      messagingSenderId: "141609051933",
      appId: "1:141609051933:web:7abdb1828986b5a29ee3f4",
      measurementId: "G-KC5NKQ57H6"
    };


    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);


    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const message =
      document.getElementById("message");


    function showMessage(text) {
      message.textContent = text;
    }


    document
      .getElementById("signupBtn")
      .addEventListener("click", async () => {

        const email = emailInput.value.trim();
        const password = passwordInput.value;

        if (!email || !password) {
          showMessage("Email and password লিখুন।");
          return;
        }

        if (password.length < 6) {
          showMessage("Password কমপক্ষে 6 characters হতে হবে।");
          return;
        }

        try {

          await createUserWithEmailAndPassword(
            auth,
            email,
            password
          );

          showMessage("Account successfully created! 🎉");

        } catch (error) {

          showMessage(
            error.message
              .replace("Firebase: Error (auth/", "")
              .replace(").", "")
          );

        }

      });


    document
      .getElementById("loginBtn")
      .addEventListener("click", async () => {

        const email = emailInput.value.trim();
        const password = passwordInput.value;

        if (!email || !password) {
          showMessage("Email and password লিখুন।");
          return;
        }

        try {

          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );

          showMessage("Login successful! 👽");

        } catch (error) {

          showMessage(
            error.message
              .replace("Firebase: Error (auth/", "")
              .replace(").", "")
          );

        }

      });

  </script>

</body>
</html>
